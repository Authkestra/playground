# cargo-deny configuration for the authkestra-playground workspace.
#
# Schema: cargo-deny v0.18+ ("v2" config). The old `[advisories].vulnerability`
# and `[advisories].unmaintained` lint-level keys were removed upstream — RUSTSEC
# vulnerabilities and unmaintained-crate advisories are now unconditionally
# denied and cannot be downgraded to a warning. This file was hand-validated
# against a locally installed `cargo-deny 0.20.2` (`cargo deny check`) run from
# the workspace root.
#
# Mirrors the license/ban/source policy used by the upstream authkestra
# framework repo (marcjazz/authkestra), since this repo is a dual MIT/Apache-2.0
# project depending on it.

[graph]
# Only check the targets we actually ship/CI for. Keep this narrow so we don't
# pull in advisories/bans for platforms (e.g. wasm32, Windows) we never build.
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# RUSTSEC vulnerability and unmaintained-crate advisories are always denied by
# cargo-deny v2 (no lint-level knob for them anymore). This `ignore` list is
# for specific advisory IDs we've triaged and accepted, each with a reason.
ignore = [
    # rsa 0.9.10 (Marvin Attack timing side-channel), pulled in transitively via
    # authkestra-engine -> jsonwebtoken -> rsa. "Solution: No safe upgrade is
    # available!" per the advisory itself, and the dependency is controlled by
    # upstream authkestra-engine, not by this repo. Re-run `cargo deny check`
    # after every authkestra-engine bump to see if a fix has landed upstream,
    # and remove this ignore the moment one is available.
    { id = "RUSTSEC-2023-0071", reason = "no safe upgrade available upstream (rsa crate); transitive via authkestra-engine -> jsonwebtoken; re-check on every authkestra-engine bump" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["Authkestra"]
