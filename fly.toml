# fly.toml app configuration for the playground API.
#
# Originally hand-written, then normalised by `fly launch` (which rewrote the
# syntax and stripped every comment). The values below survived that rewrite
# intact; the explanations did not, so they are restored here. If Fly rewrites
# this file again, re-check that the settings marked LOAD-BEARING are unchanged.
#
# See https://fly.io/docs/reference/configuration/ for the schema.

app = 'authkestra-playground-api'
primary_region = 'cdg'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  PORT = '8000'
  RUST_LOG = 'info,api=debug,authkestra=info'
  # CORS allow-list. Credentialed (the demo session rides in a cookie), so these
  # must match the frontend's origin EXACTLY — no trailing slash, scheme
  # included. A mismatch does not error: the browser just blocks the request and
  # the site looks like the API is down.
  #
  # NOTE: a Fly *secret* of the same name overrides this value. If CORS misbehaves,
  # check `fly secrets list` before editing this line.
  ALLOWED_ORIGINS = 'https://playground-web-opal.vercel.app,http://localhost:3000'

  # WebAuthn relying party.
  #
  # This is the FRONTEND's domain, not the API's: the ceremony runs in the
  # browser at the page's origin, and the browser refuses any RP ID that is not
  # a registrable suffix of it. Pointing this at the API host is the usual cause
  # of a ceremony failing with a deliberately vague browser-side error.
  #
  # A passkey is bound to the RP ID that created it, so changing this means every
  # visitor re-registers. That matters when play.authkestra.com goes live.
  WEBAUTHN_ORIGIN = 'https://playground-web-opal.vercel.app'
  WEBAUTHN_RP_ID = 'playground-web-opal.vercel.app'
  WEBAUTHN_RP_NAME = 'Authkestra Playground'

[http_service]
  internal_port = 8000
  force_https = true
  # These were load-bearing while sessions lived in process memory. They are
  # not any more: all state is in Redis with a TTL, so the service can be
  # stopped, recycled and scaled freely (docs/decisions/0004).
  #
  # Left as-is because a demo that is always warm has no cold start, not
  # because anything breaks otherwise.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Multiple machines are now safe — state is shared through Redis — so these
  # limits are ordinary capacity tuning rather than a constraint.
  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# Fly is no longer the deployment target (its trial ended; see
# docs/decisions/0004). This file is kept because the container and the
# configuration are still valid, and re-pointing at Fly is `fly deploy` plus a
# card. Note that public IPs must be allocated for the hostname to resolve:
#   fly ips allocate-v4 --shared
#   fly ips allocate-v6
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
