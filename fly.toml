# fly.toml app configuration file generated for authkestra-playground-api on 2026-09-04T00:10:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'authkestra-playground-api'
primary_region = 'cdg'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  PORT = '8000'
  RUST_LOG = 'info,api=debug,authkestra=info'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
