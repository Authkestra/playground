# fly.toml app configuration for the playground API.
#
# Originally hand-written, then normalised by `fly launch` (which rewrote the
# syntax and stripped every comment). The values below survived that rewrite
# intact; the explanations did not, so they are restored here. If Fly rewrites
# this file again, re-check that the settings marked LOAD-BEARING are unchanged.
#
# See https://fly.io/docs/reference/configuration/ for the schema.

app = 'authkestra-playground-api'
primary_region = 'cdg'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  COOKIE_SECURE = 'true'
  PORT = '8000'
  RUST_LOG = 'info,api=debug,authkestra=info'

[http_service]
  internal_port = 8000
  force_https = true
  # LOAD-BEARING — not cost tuning.
  #
  # Demo sessions live in process memory and the expiry sweeper is a
  # `tokio::interval`, so both assume a single long-lived process. Letting Fly
  # stop the machine would silently reset every visitor's configuration and
  # stall the sweep.
  #
  # `'off'` is the current spelling of what was `false`; they mean the same
  # thing. Revisit only if the session store moves to Redis — see
  # docs/decisions/0002-session-store.md.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # LOAD-BEARING — keep the app at exactly ONE machine (`fly scale count 1`).
  #
  # The in-memory session store cannot be shared across machines, so a second
  # one hands visitors a different configuration depending on which machine
  # served them. This breaks silently rather than loudly: nothing errors, the
  # visitor's toggles just appear to randomly revert.
  #
  # These concurrency limits exist to keep that single machine from being the
  # bottleneck, NOT to justify scaling out.
  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# Public IPs must be allocated for the .fly.dev hostname to resolve at all:
#   fly ips allocate-v4 --shared
#   fly ips allocate-v6
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
