# Deploy to Fly.io.
#
# `workflow_dispatch` only: Fly's trial ended, so every push-triggered run fails
# with "trial has ended" and leaves main permanently red for a reason that has
# nothing to do with the commit. Fly remains a valid target — the container and
# fly.toml are unchanged — so this is kept ready rather than deleted.
#
# The active paths are Render (its own Git integration, no workflow needed) and
# Cloud Run (deploy-cloudrun.yml). See docs/deployment.md.
#
# To make Fly the target again: add a card, then restore the `push` trigger.
name: Deploy (Fly.io)

on:
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight deploy — that could leave a machine half-updated.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `if: secrets.X != ''` is unreliable at job level (secrets aren't
      # available in job-level `if`), so gate the deploy step on an explicit
      # check instead. This lets forks and unconfigured clones run the workflow
      # without failing.
      - name: Check required secrets are configured
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "${FLY_API_TOKEN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN is not set — skipping deploy. Run 'fly launch' then add the token (Settings > Secrets and variables > Actions)."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'

      # Deploys from the repo root: the Dockerfile (apps/api/Dockerfile, named
      # in fly.toml) copies the workspace manifest and lockfile, so the build
      # context must be the workspace root rather than apps/api.
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A successful `flyctl deploy` does not mean the service is serving: a
      # process that exits at boot (a database it cannot open, a missing env
      # var) still reports a green deploy. This turns that into a red build.
      - name: Smoke test the deployed service
        if: steps.check.outputs.ready == 'true'
        run: |
          URL="https://authkestra-playground-api.fly.dev/health"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-000}"
            sleep 10
          done
          echo "::error::Deploy reported success but ${URL} never returned 200. Check 'fly logs' — the process is most likely exiting at boot."
          exit 1

  # The frontend deploys from deploy-web.yml, not from here and no longer from
  # Vercel's Git integration. That integration skipped a frontend commit that
  # was not the tip of its push and reported success while the site stayed
  # stale; see "Why the frontend deploy moved into CI" in the README.
