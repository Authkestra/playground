name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight deploy — that could leave a machine half-updated.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `if: secrets.X != ''` is unreliable at job level (secrets aren't
      # available in job-level `if`), so gate the deploy step on an explicit
      # check instead. This lets forks and unconfigured clones run the workflow
      # without failing.
      - name: Check required secrets are configured
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "${FLY_API_TOKEN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN is not set — skipping deploy. Run 'fly launch' then add the token (Settings > Secrets and variables > Actions)."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'

      # Deploys from the repo root: the Dockerfile (apps/api/Dockerfile, named
      # in fly.toml) copies the workspace manifest and lockfile, so the build
      # context must be the workspace root rather than apps/api.
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Frontend deploys through Vercel's own Git integration rather than a workflow
  # step: Vercel builds on push to `main`, gives PRs preview deployments for
  # free, and needs no tokens stored here. Set Root Directory to `apps/web` in
  # Project Settings — Vercel has no vercel.json key for it.
  #
  # If you ever want CI to own the deploy instead, add VERCEL_TOKEN,
  # VERCEL_ORG_ID and VERCEL_PROJECT_ID as secrets and use amondnet/vercel-action.
