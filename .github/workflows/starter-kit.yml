# Does what visitors download actually compile?
#
# The starter kit's credibility rests entirely on this: a generated project
# that does not build is worse than no generator at all. So CI generates real
# projects with the same code the service runs, and builds them.
#
# Two sets, because the combinatorial space grows with every scenario and a
# matrix slow enough to be annoying is one people learn to ignore:
#
#   pull requests  - the representative set (~14): nothing on, each method
#                    alone, one per provider, and everything at once
#   nightly        - the full product (128), with dependencies updated first,
#                    so a newly published authkestra that breaks generated
#                    code is caught here rather than by whoever downloads next
#
# The counts are indicative, not authoritative — matrix.rs is. They are written
# down so a change that multiplies the nightly run is noticed in review rather
# than in the Actions bill.
#
# The list itself lives in `apps/api/src/kit/matrix.rs` and is read from the
# binary below. It is deliberately not repeated in this file: a matrix that
# disagrees with the generator is worse than no matrix, because it reports
# success for projects nobody built.
name: Starter kit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:20 UTC daily. Nothing depends on the exact time; it is offset from the
    # hour because everyone schedules on the hour and the runners are busier.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      exhaustive:
        description: "Build the full product rather than the representative set"
        type: boolean
        default: false

concurrency:
  group: starter-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same `changes` + `if:` pattern as ci.yml rather than `on.*.paths`, for the
  # reason documented there: a path-gated job never reports a check run, and a
  # required check that never reports blocks the PR forever.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            generator:
              - 'apps/api/src/kit/**'
              - 'apps/api/src/scenario/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/starter-kit.yml'

  plan:
    name: Plan the matrix
    needs: changes
    if: needs.changes.outputs.generator == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      combinations: ${{ steps.list.outputs.combinations }}
      exhaustive: ${{ steps.mode.outputs.exhaustive }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Decide which set to build
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ inputs.exhaustive }}" = "true" ]; then
            echo "exhaustive=true" >> "$GITHUB_OUTPUT"
          else
            echo "exhaustive=false" >> "$GITHUB_OUTPUT"
          fi

      # Built once and shared. Compiling the api crate in each matrix leg would
      # dominate the run and tell us nothing new each time.
      - name: Build the generator
        run: cargo build -p api --bin generate-kit

      - name: Read the combination list from the generator
        id: list
        run: |
          if [ "${{ steps.mode.outputs.exhaustive }}" = "true" ]; then
            list=$(./target/debug/generate-kit --list-json --exhaustive)
          else
            list=$(./target/debug/generate-kit --list-json)
          fi
          echo "combinations=$list" >> "$GITHUB_OUTPUT"
          echo "Building $(echo "$list" | grep -o '"name"' | wc -l) combination(s)"

      - uses: actions/upload-artifact@v4
        with:
          name: generate-kit
          path: target/debug/generate-kit
          retention-days: 1

  build:
    name: ${{ matrix.combination.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Every broken combination is worth knowing about in one run. Stopping at
      # the first turns "three fragments regressed" into three separate pushes.
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.plan.outputs.combinations) }}
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: generate-kit
      - run: chmod +x ./generate-kit

      # Generated projects share almost all of their dependency graph, so one
      # shared cache serves every leg.
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: generated-project
          workspaces: generated

      # By name, not by spec: a combination carries its own download opt-ins,
      # and repeating those as flags here would let the two disagree.
      - name: Generate
        run: ./generate-kit --name "${{ matrix.combination.name }}" --out generated

      - name: Show what was generated
        run: |
          echo "::group::Cargo.toml"
          cat generated/Cargo.toml
          echo "::endgroup::"

      # Only on the nightly: resolve dependencies afresh so a newly published
      # authkestra within the pinned range is exercised here. On pull requests
      # the lockless build already picks the newest compatible version, but the
      # nightly is what makes "upstream released something that breaks
      # generated code" a CI failure rather than a support request.
      - name: Update dependencies
        if: needs.plan.outputs.exhaustive == 'true'
        working-directory: generated
        run: cargo update

      # Compiling proves the project is valid, not that it is complete: a
      # fragment that dropped its routes would still build. Cheap to assert,
      # and it fails in seconds rather than after a full build.
      - name: Check the ceremony routes are there
        run: |
          case "${{ matrix.combination.spec }}" in
            *passkeys*)
              grep -q '/auth/passkey/register/start' generated/src/main.rs \
                || { echo "::error::passkeys selected but no ceremony routes generated"; exit 1; } ;;
          esac
          case "${{ matrix.combination.spec }}" in
            *totp*)
              grep -q '/auth/totp/enroll' generated/src/main.rs \
                || { echo "::error::totp selected but no ceremony routes generated"; exit 1; } ;;
          esac
          # The captcha fragment's whole point is *where* the check sits, and a
          # fragment that dropped the route would still compile.
          case "${{ matrix.combination.spec }}" in
            *captcha*)
              grep -q '/auth/guarded' generated/src/main.rs \
                || { echo "::error::captcha selected but no guarded route generated"; exit 1; }
              grep -q 'captcha.verify(' generated/src/main.rs \
                || { echo "::error::the guarded route does not verify anything"; exit 1; } ;;
          esac

      # The TypeScript client is a file the Rust build never looks at, so
      # compiling proves nothing about it either way.
      # Written with `if`, not `cmd && { exit 1; }`. The steps run under
      # `bash -e`, where a trailing `grep -q` that finds nothing returns 1 and
      # fails the step — so the shorthand fails exactly when the check passes.
      - name: Check the opt-ins produced what they promise
        run: |
          case "${{ matrix.combination.name }}" in
            *extras*)
              if [ ! -f generated/client/authkestra.ts ]; then
                echo "::error::the client opt-in produced no client"
                exit 1
              fi
              if ! grep -q 'utoipa::path' generated/src/main.rs; then
                echo "::error::the openapi opt-in annotated nothing"
                exit 1
              fi
              ;;
            *)
              if [ -e generated/client ]; then
                echo "::error::a plain download carries a TypeScript client"
                exit 1
              fi
              if grep -q 'utoipa' generated/src/main.rs; then
                echo "::error::a plain download carries utoipa annotations"
                exit 1
              fi
              ;;
          esac
          echo "opt-ins are as expected"

      - name: Build it
        working-directory: generated
        run: cargo check --all-targets

      - name: Say which combination broke
        if: failure()
        run: |
          echo "::error title=Generated project failed to build::" \
            "combination '${{ matrix.combination.name }}'" \
            "(spec: '${{ matrix.combination.spec }}') does not compile." \
            "Reproduce locally with:" \
            "cargo run -p api --bin generate-kit --" \
            "--spec '${{ matrix.combination.spec }}' --out /tmp/kit" \
            "&& cargo check --manifest-path /tmp/kit/Cargo.toml"

  # Compiling proves the download is valid. This proves it is the same thing
  # the visitor just used, which is the actual promise being made.
  parity:
    name: Generated project behaves like the playground
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: generate-kit
      - run: chmod +x ./generate-kit

      - name: Generate a project with both ceremonies
        run: ./generate-kit --name totp-passkeys --out generated

      - name: Start it
        working-directory: generated
        env:
          PORT: "8300"
          DATABASE_URL: "sqlite://parity.db"
          WEBAUTHN_ORIGIN: "http://localhost:8300"
        run: |
          cargo build
          ./target/debug/authkestra-starter &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8300/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the generated project never became healthy"
          exit 1

      # The same assertions run against the playground in the `backend` job.
      # PARITY_TARGET is required, not optional: a parity test that skips
      # itself would report success for a comparison it never made.
      - name: Run the shared contract against it
        env:
          PARITY_TARGET: http://127.0.0.1:8300
        run: cargo test -p api --test parity -- --ignored

  # Does the *deployment* half of what visitors download actually work?
  #
  # `cargo check` cannot answer this. A Dockerfile that does not build, or a
  # render.yaml that Render rejects, fails at the moment someone is trying to
  # put their project online — the point at which they are least willing to
  # debug someone else's template. So this builds the image for real and runs
  # it, rather than asserting on the text of the file.
  #
  # One combination, not the matrix: the manifests vary with the *env vars* a
  # configuration needs, not with which scenarios are on, and passkeys+OAuth
  # exercises both a host-bound variable and a secret. Building fourteen
  # identical images would buy nothing.
  deploy-manifests:
    name: Generated deployment manifests work
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-kit
      - run: chmod +x ./generate-kit

      - name: Generate a project with every manifest
        run: ./generate-kit --spec "passkeys,oauth=github" --deploy docker,render,fly,railway --out generated

      # A default that is right locally is not automatically right on a host.
      # `WEBAUTHN_ORIGIN` defaults to http://localhost:3000 for `cargo run`,
      # and a manifest that copies it deploys a service whose passkey flow
      # cannot succeed while looking configured. The generator has unit tests
      # for this; this asserts it on the bytes actually shipped.
      - name: No manifest carries a localhost value
        working-directory: generated
        run: |
          for f in render.yaml fly.toml railway.json; do
            # Comments are stripped first: fly.toml legitimately *names* these
            # variables in a commented block telling you to fill them in once
            # the hostname exists. It is an assigned value that is the bug.
            if grep -v '^[[:space:]]*#' "$f" | grep -q 'localhost'; then
              echo "::error file=$f::a deployment manifest must not carry a localhost value"
              grep -n 'localhost' "$f"
              exit 1
            fi
          done
          echo "OK"

      - name: The manifests are well-formed
        working-directory: generated
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import json; json.load(open('railway.json')); print('railway.json OK')"
          python3 -c "import tomllib; tomllib.load(open('fly.toml','rb')); print('fly.toml OK')"
          python3 -c "import yaml; d=yaml.safe_load(open('render.yaml')); assert d['services'][0]['runtime']=='docker', d; print('render.yaml OK')"

      - name: Build the image the manifests point at
        working-directory: generated
        run: docker build -t authkestra-starter-ci .

      # Building proves it compiles; running proves the image is actually
      # usable — the binary is where the Dockerfile said, the non-root user
      # can execute it, and the port it exposes is the port it binds.
      - name: Run it and wait for health
        run: |
          docker run -d --name starter -p 8400:3000 \
            -e WEBAUTHN_ORIGIN=http://localhost:8400 \
            -e WEBAUTHN_RP_ID=localhost \
            -e OAUTH_REDIRECT_BASE=http://localhost:8400 \
            -e GITHUB_CLIENT_ID=unused -e GITHUB_CLIENT_SECRET=unused \
            authkestra-starter-ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8400/health >/dev/null && { echo "healthy"; exit 0; }
            sleep 2
          done
          echo "::error::the container never became healthy"
          docker logs starter
          exit 1

      - name: Container logs
        if: always()
        run: docker logs starter || true

  # A single check to make required, so branch protection does not need
  # updating every time the matrix changes shape.
  result:
    name: Generated projects build
    needs: [build, parity, deploy-manifests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          case "${{ needs.build.result }}" in
            success|skipped) ;;
            *) echo "At least one generated project failed to build."; exit 1 ;;
          esac
          case "${{ needs.parity.result }}" in
            success|skipped) ;;
            *) echo "The generated project does not behave like the playground."; exit 1 ;;
          esac
          case "${{ needs.deploy-manifests.result }}" in
            success|skipped) ;;
            *) echo "The generated deployment manifests do not work."; exit 1 ;;
          esac
          echo "OK"
