# Deploy the frontend to Vercel.
#
# This exists because the dashboard Git integration failed silently. The API
# deploys on push and was current, while play.authkestra.com went on serving a
# build from before the resource-server rebuild — the old symmetric panel, flow
# log and all — for hours, with nothing anywhere reporting a problem. A deploy
# that can be stale without turning something red is a deploy you cannot trust.
#
# CI owns the build here, so what ships is this checkout by construction rather
# than whatever the dashboard last happened to build.
#
# Required secrets, set on the `production` environment rather than on the
# repository (Settings > Environments > production):
#   VERCEL_TOKEN       — Account Settings > Tokens, scoped to the team that
#                        owns the project. It must be a full-access token: one
#                        restricted to a project reads the project fine and
#                        still cannot drive the CLI, which resolves its scope
#                        through /v2/user and /teams first. The preflight below
#                        checks for exactly that.
#   VERCEL_ORG_ID      — Team Settings > General > Team ID
#   VERCEL_PROJECT_ID  — Project Settings > General > Project ID (prj_…)
# Without them the workflow warns and skips, so forks and unconfigured clones
# stay green. That matches deploy.yml's handling of FLY_API_TOKEN.
#
# One project setting still matters: Root Directory must be `apps/web`, which
# `vercel pull` fetches into the build. Vercel has no vercel.json key for it.
# `pnpm install` runs at the workspace root regardless, because apps/web
# depends on @playground/api-types as `workspace:*` and resolving that from
# apps/web alone is precisely what breaks a naive monorepo setup.
#
# Turn OFF the dashboard Git integration once this is running, or every push
# deploys twice and the two race.
name: Deploy (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight deploy — a cancelled one can leave the alias
  # pointing at a half-promoted build.
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    # The Vercel secrets live on this environment, not on the repo. Without
    # this line `secrets.VERCEL_TOKEN` resolves to empty, the check below
    # skips every deploy step, and the run still reports success — the same
    # silent-skip this workflow exists to stop.
    environment:
      name: production
      url: https://play.authkestra.com
    steps:
      - uses: actions/checkout@v4

      # Secrets are not available to job-level `if`, so gate the steps on an
      # explicit check rather than the job.
      - name: Check required secrets are configured
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set — skipping deploy. Run 'vercel link' in apps/web, then copy the ids out of .vercel/project.json."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm

      # At the workspace root: apps/web resolves @playground/api-types through
      # the pnpm workspace link, which only exists after a root install.
      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: pnpm add -g vercel@latest

      # `vercel pull` answers a wrong project id, an org id that is not the
      # team owning the project, and a token scoped to a different team with
      # the same opaque "Could not retrieve Project Settings". Ask the API
      # directly first so the run names which of the three it is. Values are
      # never echoed — only the HTTP status and Vercel's own error code.
      - name: Verify the project ids resolve
        if: steps.check.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            *) echo "::error::VERCEL_PROJECT_ID does not begin with 'prj_'. It wants the Project ID from Project Settings > General, not the project's name or slug."; exit 1 ;;
          esac

          code=$(curl -s -o /tmp/vproj.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" || true)

          if [ "$code" = "200" ]; then
            echo "project resolves: $(jq -r '.name // "?"' /tmp/vproj.json)"
            echo "root directory:   $(jq -r '.rootDirectory // "(not set — must be apps/web)"' /tmp/vproj.json)"
            if [ "$(jq -r '.rootDirectory // ""' /tmp/vproj.json)" != "apps/web" ]; then
              echo "::warning::Root Directory is not 'apps/web'. The build will run at the workspace root and Next.js will not be found."
            fi

            # The project's own accountId is the org that owns it. The API
            # ignores a teamId that the token already scopes past, so the call
            # above can succeed on a VERCEL_ORG_ID the CLI will then reject —
            # which is exactly how `vercel pull` ends up saying only "Could not
            # retrieve Project Settings". Trust the accountId and say so when
            # the secret disagrees.
            account=$(jq -r '.accountId // ""' /tmp/vproj.json)
            if [ -n "$account" ] && [ "$account" != "$VERCEL_ORG_ID" ]; then
              echo "::warning::VERCEL_ORG_ID is not the account that owns this project; using the project's own accountId for this run. Update the secret — Team Settings > General > Team ID, or the personal account id if the project is not in a team."
              ORG="$account"
            else
              ORG="$VERCEL_ORG_ID"
            fi

            # A token restricted to a project reads the project fine and still
            # cannot drive the CLI, which resolves its scope through /v2/user
            # and /teams/<org> before touching the project at all. That pair
            # failing is the whole of "Could not retrieve Project Settings", so
            # check it here where the remedy can be named.
            ucode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user || true)
            case "$VERCEL_ORG_ID" in
              team_*) tcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                        -H "Authorization: Bearer $VERCEL_TOKEN" \
                        "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID" || true) ;;
              *)      tcode=200 ;;
            esac
            if [ "$ucode" != "200" ] || [ "$tcode" != "200" ]; then
              echo "::error::The token reads this project but not its own scope (/v2/user HTTP $ucode, /v2/teams HTTP $tcode), so the Vercel CLI cannot use it. Create a full-access token: Account Settings > Tokens, scoped to the team that owns the project — not one restricted to a project or an access group."
              exit 1
            fi

            # Write the link file rather than relying on the env vars alone:
            # the CLI reads .vercel/project.json first, and this removes any
            # ambiguity about which scope it resolves.
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG" "$VERCEL_PROJECT_ID" > .vercel/project.json
            echo "wrote .vercel/project.json"
            exit 0
          fi

          slug=$(jq -r '.error.code // "unknown"' /tmp/vproj.json 2>/dev/null || echo unknown)
          case "$code" in
            403) echo "::error::HTTP 403 ($slug): the token is valid but not scoped to this team. Recreate it under the team that owns the project (Account Settings > Tokens > Scope)." ;;
            404) echo "::error::HTTP 404 ($slug): no project with this id under this team. Either VERCEL_PROJECT_ID belongs to a different project, or VERCEL_ORG_ID is not the team that owns it — a personal-account id where the project lives in a team is the usual cause." ;;
            401) echo "::error::HTTP 401 ($slug): the token is rejected outright. Generate a new one." ;;
            *)   echo "::error::HTTP $code ($slug) resolving the project: $(jq -r '.error.message // "no message"' /tmp/vproj.json 2>/dev/null)" ;;
          esac
          exit 1

      # Brings down the project settings — Root Directory, framework preset and
      # the environment variables the build needs, NEXT_PUBLIC_API_BASE_URL
      # among them. Without this the build would run with none of them set and
      # the app would come up pointing nowhere.
      - name: Pull Vercel project settings
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # --prebuilt uploads what we just built instead of rebuilding on Vercel,
      # so the artifact that goes live is the one this job produced from this
      # commit.
      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # A green deploy is not a served page, and — the failure that prompted
      # this workflow — a served page is not necessarily the current one. The
      # app is client-rendered, so the shell HTML carries almost no copy: the
      # marker has to be looked for in the JS bundles the shell references.
      #
      # MARKER is a string from the current frontend. Its only job is to be
      # absent from any older build, so if you change this copy, change it
      # here too — a marker that no longer exists fails the deploy loudly,
      # which is the safe direction to fail in.
      - name: Smoke test the deployed site
        if: steps.check.outputs.ready == 'true'
        env:
          URL: https://play.authkestra.com
          MARKER: Unpublished key
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 15 "$URL/?cb=$RANDOM$RANDOM" || true)
            if [ "$code" = "200" ]; then
              break
            fi
            echo "attempt ${attempt}: HTTP ${code:-000}"
            sleep 6
          done
          if [ "$code" != "200" ]; then
            echo "::error::${URL} never returned 200 (last: HTTP ${code:-000})."
            exit 1
          fi

          # List the bundles to a file first and read from a redirect rather
          # than piping into `while`: a pipeline runs its right-hand side in a
          # subshell, which swallows failures here.
          grep -o 'src="[^"]*\.js"' /tmp/index.html | sed 's/src="//;s/"//' | sort -u > /tmp/bundles.txt
          if [ ! -s /tmp/bundles.txt ]; then
            echo "::error::${URL} returned 200 but referenced no JS bundles — the page is not the app."
            exit 1
          fi

          : > /tmp/bundles.js
          while read -r path; do
            curl -sf --max-time 15 "$URL$path" >> /tmp/bundles.js \
              || { echo "::error::could not fetch $URL$path"; exit 1; }
          done < /tmp/bundles.txt

          if ! grep -qF "$MARKER" /tmp/bundles.js; then
            echo "::error::${URL} is serving a build without \"${MARKER}\" — the deploy reported success but the live site is stale, or the marker in this workflow is out of date."
            exit 1
          fi
          echo "live and current: found \"${MARKER}\" in the served bundles"
