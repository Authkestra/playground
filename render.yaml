# Render blueprint for the playground API.
#
# Render is the card-free option: connect this repo in the dashboard ("New +" ->
# "Blueprint") and it builds the Dockerfile and redeploys on every push to main,
# with no CI secrets stored here.
#
# The free plan spins the service down after inactivity. That used to be
# disqualifying — demo sessions lived in process memory — but all state is in
# Redis now (docs/decisions/0004), so a spin-down costs a cold start and
# nothing else. Visitors keep their configuration across it.
services:
  - type: web
    name: authkestra-playground-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # Built from the repo root: the Dockerfile copies the workspace manifest
    # and lockfile, so the build context must be the workspace root.
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # `checksPass` rather than `commit`: only deploy when CI is green, so a
    # build that fails fmt/clippy/tests/deny cannot reach production.
    # (`autoDeploy` is deprecated in favour of this.)
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8000"
      # Served over HTTPS by Render's proxy.
      - key: COOKIE_SECURE
        value: "true"
      - key: RUST_LOG
        value: "info,api=debug,authkestra=info"
      # Client IP: DO NOT guess this. Render documents setting the *first*
      # X-Forwarded-For entry to the real client IP, which would make
      # `leftmost` correct — but reading the leftmost entry is a rate-limit
      # bypass anywhere the proxy appends instead of overwriting, and Render
      # also fronts traffic with Cloudflare (it forwards CF-Ray), so
      # cf-connecting-ip may be the better source.
      #
      # Left at the safe default (rightmost, unforgeable). Once deployed, set
      # ADMIN_TOKEN and check what actually arrives:
      #   curl -H "Authorization: Bearer $ADMIN_TOKEN" https://<api>/admin/client-ip
      # then set TRUSTED_CLIENT_IP_HEADER (preferred) or
      # CLIENT_IP_XFF_POSITION from the answer.
      #
      # Cost of leaving it: every visitor shares one rate-limit bucket, so
      # limits are coarse. It is never a bypass.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: ""
      # Set these in the dashboard, not here:
      #   REDIS_URL        rediss://... from your Redis provider
      #   ALLOWED_ORIGINS  the frontend origin(s), no trailing slash
      #   WEBAUTHN_ORIGIN  the frontend origin
      #   WEBAUTHN_RP_ID   the frontend's domain
      #   ADMIN_TOKEN      long random string, enables the kill switch
      #   OAUTH_STATE_KEY  >=32 bytes
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: OAUTH_STATE_KEY
        sync: false
