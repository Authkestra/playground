[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# --- authkestra (see docs/decisions/0001-dependency-and-tls-baseline.md) ---
authkestra-engine = { workspace = true, features = [
    "token",
    "session",
    "memory",
    "totp",
    "webauthn",
    "sql-sqlite",
    "captcha",
    "rustls-aws-lc-rs",
] }
authkestra-axum = { workspace = true, features = [
    "macros",
    "session",
    "token",
    "captcha",
    "rustls-aws-lc-rs",
] }
authkestra-providers = { workspace = true, features = [
    "github",
    "google",
    "discord",
    "rustls-aws-lc-rs",
] }

# --- web stack ---
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower-cookies = "0.11.0"
tower_governor = "0.7"

# --- state storage ---
# Redis holds demo sessions, ceremony state and scenario credentials, so the
# process itself is stateless and can be scaled to zero.
#
# TLS features are enabled HERE rather than relying on authkestra-engine, which
# declares `redis` with only `tokio-comp`. Cargo features are additive, so
# enabling them in this crate gives the single `redis` in the graph TLS support
# — which the engine's own `RedisStore` then benefits from via
# `RedisStore::with_client`. Managed providers require `rediss://`.
redis = { version = "0.27", features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }

# Needed to install the rustls crypto provider explicitly at startup.
#
# `redis`'s `tls-rustls` feature hardcodes `rustls/ring`, while
# authkestra-engine's `rustls-aws-lc-rs` brings `rustls/aws-lc-rs` in through
# reqwest. Cargo features are additive, so the single `rustls` in the graph ends
# up with BOTH providers enabled and refuses to choose one — it panics on the
# first TLS handshake. Neither feature set can be changed from here, so the
# process picks explicitly instead. See `install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
async-trait = "0.1"
thiserror = "2"
# Needed directly to build the `Webauthn` relying-party instance and to name the
# ceremony types in signatures; the engine re-exports the traits but not these.
webauthn-rs = "0.5.0"
url = "2.5"

# --- support ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Generates valid TOTP codes so the verification path is tested for real
# rather than only asserting that wrong codes fail.
totp-rs = "5"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
